apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wboz.fullname" . }}-secrets
  labels:
    {{- include "wboz.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOT_TOKEN: {{ required "secrets.botToken is required" .Values.secrets.botToken | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user .Values.secrets.postgresPassword (include "wboz.postgresServiceName" .) .Values.postgres.db | quote }}
