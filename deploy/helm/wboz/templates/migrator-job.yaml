apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wboz.fullname" . }}-migrator
  labels:
    {{- include "wboz.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "wboz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrator
    spec:
      restartPolicy: Never
      containers:
        - name: migrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["poetry", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "wboz.fullname" . }}-config
            - secretRef:
                name: {{ include "wboz.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources.migrator | nindent 12 }}
