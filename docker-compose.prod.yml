services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wboz}
      POSTGRES_USER: ${POSTGRES_USER:-wboz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wboz} -d ${POSTGRES_DB:-wboz}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrator:
    image: ${WBOZ_IMAGE:?WBOZ_IMAGE is required}
    restart: "no"
    env_file:
      - .env
    command: ["poetry", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${WBOZ_IMAGE:?WBOZ_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env
    command: ["poetry", "run", "python", "-m", "app", "server", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/liveness', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    image: ${WBOZ_IMAGE:?WBOZ_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env
    command: ["poetry", "run", "python", "-m", "app", "bot"]
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
