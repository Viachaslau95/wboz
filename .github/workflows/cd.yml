name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy-helm:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}
      NAMESPACE: ${{ vars.K8S_NAMESPACE || 'wboz' }}
      RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME || 'wboz' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Prepare Helm values override
        run: |
          cat > /tmp/values-ci.yaml <<EOF
          image:
            repository: ghcr.io/${{ github.repository }}
            tag: ${{ github.sha }}
          secrets:
            botToken: "${{ secrets.BOT_TOKEN }}"
            postgresPassword: "${{ secrets.POSTGRES_PASSWORD }}"
          ingress:
            host: "${{ vars.APP_DOMAIN }}"
          EOF

      - name: Helm deploy
        run: |
          helm upgrade --install "${RELEASE_NAME}" ./deploy/helm/wboz \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --wait \
            --timeout 10m \
            -f /tmp/values-ci.yaml
